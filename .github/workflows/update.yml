name: Update dashboard and deploy Pages
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collector
        run: python -m unittest discover -s tests
      - name: Collect public repository data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect.py
      - name: Validate public output
        run: python scripts/validate.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
